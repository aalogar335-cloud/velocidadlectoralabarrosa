<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conocimiento del Medio · Exámenes de práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{--bg:#f2f6f5;--card:#fff;--ink:#12312d;--mut:#52695f;--line:#dbe5e2;
--acc:#087f6c;--acc-d:#056252;--acc-t:#056252;--acc-soft:#dff3ee;--on:#fff;
--ok:#14803c;--ok-soft:#e3f5e8;--mid:#9a5b00;--mid-soft:#fff0d4;--bad:#c92a3a;--bad-soft:#fde8ea;
--t0:#dff3ee;--t1:#fff1c9;--t2:#fde4de;--t3:#e1effd;--sh:0 6px 18px rgba(8,127,108,.08);
--fd:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;--fb:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a1a;--card:#142425;--ink:#e6f2ef;--mut:#9db5ae;--line:#254240;
--acc:#3ccbb0;--acc-d:#1f8f7b;--acc-t:#7ee3cf;--acc-soft:#12403a;--on:#04211c;
--ok:#5ad18a;--ok-soft:#123a24;--mid:#ffc266;--mid-soft:#3d2f10;--bad:#ff8a93;--bad-soft:#44191e;
--t0:#12403a;--t1:#3d3210;--t2:#44221c;--t3:#13304d;--sh:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--fb)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,calc((100% - 720px)/2));background:var(--card);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:600 1.15rem/1.1 var(--fd)}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--acc-soft);font-size:1.4rem}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{padding:7px 15px;border:0;border-radius:999px;background:var(--acc-soft);color:var(--acc-t);font:600 .95rem var(--fd)}
nav button:hover{background:var(--acc);color:var(--on)}
main{max-width:720px;margin:0 auto;padding:22px 16px 32px}
main>h3{margin:26px 0 12px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:0 0 24px}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.2;margin:0 0 10px}
h1{font-size:1.75rem}h2{font-size:1.6rem}h3{font-size:1.12rem}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.card.q h3{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.num{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--acc-soft);color:var(--acc-t);font:600 1rem var(--fd)}
.btn{display:inline-block;border:0;border-radius:14px;padding:13px 28px;background:var(--acc);color:var(--on);font:600 1.1rem var(--fd);box-shadow:0 4px 0 var(--acc-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acc-d)}
.btn:disabled{opacity:.6;transform:none}
button.sm{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;font-weight:600}
button.sm:hover{border-color:var(--acc)}
button.sm.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.seg{display:inline-flex;gap:4px;padding:4px;margin-bottom:20px;background:var(--card);border:2px solid var(--line);border-radius:999px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 20px;font:600 1rem var(--fd);color:var(--mut)}
.seg .on{background:var(--acc);color:var(--on)}
label{display:block;font-weight:800;margin-bottom:14px}
input[type=text],input[type=password],textarea{display:block;width:100%;font:400 1rem var(--fb);margin-top:6px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--acc)}
.login{max-width:400px;margin:20px auto;padding:28px 24px;text-align:center}
.login label{text-align:left}
.hero{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:var(--acc-soft);font-size:2.6rem}
.err{color:var(--bad);font-weight:600;min-height:1.5em;margin:0 0 10px}
.mut{color:var(--mut)}.ok{color:var(--ok)}.mid{color:var(--mid)}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.exam{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:12px;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:var(--sh);transition:border-color .15s}
button.exam:hover{border-color:var(--acc)}
.ico{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--t0);font-size:1.7rem}
.t1 .ico{background:var(--t1)}.t2 .ico{background:var(--t2)}.t3 .ico{background:var(--t3)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font:600 1.08rem/1.25 var(--fd)}
.ttl small{color:var(--mut);font-size:.9rem}
.badge{flex:none;border-radius:12px;padding:6px 14px;background:var(--acc-soft);color:var(--acc-t);font:600 1.05rem var(--fd)}
.badge.go{display:grid;place-items:center;width:40px;height:40px;padding:0;border-radius:50%;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.mid{background:var(--mid-soft);color:var(--mid)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:520px){.exam{flex-wrap:wrap}.acts{flex-basis:100%}}
.opt{display:flex;align-items:center;gap:12px;margin-bottom:9px;padding:11px 14px;border:2px solid var(--line);border-radius:14px;font-weight:400;cursor:pointer;transition:border-color .12s,background .12s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.let{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--bg);color:var(--mut);font:600 .95rem var(--fd)}
.opt:hover{border-color:var(--acc)}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.opt:has(input:checked) .let{background:var(--acc);color:var(--on)}
.opt:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
.prog{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:14px;margin:0 0 18px;padding:10px 16px;background:var(--card);border:2px solid var(--line);border-radius:16px;font:600 .95rem var(--fd);white-space:nowrap}
.bar{flex:1;height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar i{display:block;width:0;height:100%;border-radius:inherit;background:var(--acc);transition:width .25s}
.modelo{margin:14px 0;padding:14px 16px;border-left:6px solid var(--acc);border-radius:14px;background:var(--acc-soft)}
.modelo p{margin:6px 0 0}
.ev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ev button{padding:11px 6px;border:2px solid var(--line);border-radius:14px;background:var(--card);font:600 .98rem var(--fd)}
.ev button:hover{border-color:var(--acc)}
.ev button.sel[data-e="1"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ev button.sel[data-e="0.5"]{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.ev button.sel[data-e="0"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
@media(max-width:380px){.ev{grid-template-columns:1fr}}
.score{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:24px;border:0;border-radius:26px;background:var(--acc-soft)}
.score.ok{background:var(--ok-soft)}.score.mid{background:var(--mid-soft)}.score.bad{background:var(--bad-soft)}
.score{color:var(--ink)}
.score h2{margin:0 0 4px}
@media(max-width:520px){.score{flex-direction:column;text-align:center}.score .chips{justify-content:center}}
details .exam{box-shadow:none;border-width:1px;padding:10px 12px;margin-bottom:8px}
details .ico{width:42px;height:42px;font-size:1.3rem}
.msg{font:600 1.2rem var(--fd);margin:0 0 10px}
.ring{--c:var(--ok);flex:none;position:relative;display:grid;place-items:center;align-content:center;width:136px;height:136px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--card) 0);animation:fill 1.1s cubic-bezier(.2,.8,.2,1)}
.ring::before{content:"";position:absolute;inset:15px;border-radius:50%;background:var(--card)}
.ring b,.ring span{position:relative}
.ring b{font:600 2.4rem/1 var(--fd)}
.ring span{font-size:.85rem;color:var(--mut)}
.ring.mid{--c:var(--mid)}.ring.bad{--c:var(--bad)}
@keyframes fill{from{--p:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:4px 13px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:.92rem;font-weight:600}
.chip b{font-family:var(--fd)}
.score .chip{border-color:transparent}
.res{border-left:8px solid var(--line)}
.res.good{border-left-color:var(--ok)}.res.part{border-left-color:var(--mid)}.res.wrong{border-left-color:var(--bad)}
.sol{margin:6px 0;padding:9px 14px;border-radius:12px;background:var(--bg)}
.sol.right{background:var(--ok-soft);font-weight:800}
.spark{display:flex;align-items:flex-end;gap:8px;height:116px;margin-top:14px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;flex:1;max-width:52px;height:100%}
.col small{font:600 .85rem var(--fd);color:var(--mut)}
.col i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--acc)}
.col i.ok{background:var(--ok)}.col i.mid{background:var(--mid)}.col i.bad{background:var(--bad)}
details.card summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;font-weight:800}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"▾";color:var(--mut);transition:transform .15s}
details.card[open] summary::after{transform:rotate(180deg)}
details.card[open] summary{margin-bottom:14px}
.who{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.who>span{min-width:0;overflow-wrap:anywhere;line-height:1.3}
.av{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font:600 1rem var(--fd);font-style:normal;background:hsl(var(--h) 60% 86%);color:hsl(var(--h) 55% 22%)}
.meta{color:var(--mut);font-weight:600;font-size:.92rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true">🌍</span>Conocimiento del Medio</div><nav id="nav" hidden>
<button data-go="profe" hidden>Mis alumnos</button><button data-go="lista">Exámenes</button><button data-go="res">Mis resultados</button><button data-go="out">Salir</button></nav></header>
<main id="app"></main>
<footer>Versión 5</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIGURACIÓN ===== */
const SUPABASE_URL = 'https://rsnlvstocpajmxcihbhs.supabase.co';       // https://xxxx.supabase.co
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzbmx2c3RvY3Bham14Y2loYmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMTAzNzEsImV4cCI6MjA4NDc4NjM3MX0.AAkZ3nAxzThYPIVCLWmt_qc8sUsKgS7u_98HrtT3y_0';  // clave pública "anon"
const RUTA = 'examenes';                        // carpeta: examenes/quinto/ y examenes/sexto/
/* ========================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
let cred = null;  // { p_nombre, p_clave }: se envía a cada función de Supabase
const intentos = async () => { const { data, error } = await sb.rpc('examenes_mis_intentos', cred); if (error) throw error; return data || []; };
async function entrarCon(c) {
  const { data } = await sb.rpc('examenes_login', c);
  if (!data) return false;
  user = data; cred = c; try { sessionStorage.setItem('cred', JSON.stringify(c)); } catch (e) {}
  return true;
}
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, '');
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
const nota = a => { const t = a.test_total + a.open_total; return t ? (a.test_correct + Number(a.open_score)) / t * 10 : 0; };
const nivelTxt = n => n === 'quinto' ? '5.º' : '6.º';
const fecha = d => new Date(d).toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'});
const cls = n => n >= 7 ? 'ok' : n >= 5 ? 'mid' : 'bad';
const IC = ['🍎', '🫁', '🧠', '🧪'];
const hue = t => [...t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const tileIntento = (a, attr, k) => `<button class="exam t${k % 4}" ${attr}><span class="ico">📝</span><span class="ttl"><b>${esc(a.exam_title)}</b><small>${nivelTxt(a.exam_id.split('/')[0])} de Primaria, ${fecha(a.created_at)}</small></span><span class="badge ${cls(nota(a))}">${fmt(nota(a))}</span></button>`;
let user = null, nivel = 'quinto';
try { nivel = localStorage.getItem('nivel') || 'quinto'; } catch (e) {}

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url); return r.json(); }
const esProfe = () => !!user && /^\s*profe-/i.test(user.nombre);
function inicio() { esProfe() ? vistaProfe() : vistaLista(); }
function nav(on) {
  $('#nav').hidden = !on;
  if (on && user) document.querySelectorAll('#nav [data-go]').forEach(b => { const g = b.dataset.go; b.hidden = g === 'out' || g === 'lista' ? false : (g === 'profe') !== esProfe(); });
}

$('#nav').onclick = e => {
  const g = e.target.dataset.go; if (!g) return;
  if (g === 'profe') vistaProfe();
  if (g === 'lista') vistaLista();
  if (g === 'res') vistaResultados();
  if (g === 'out') { user = null; cred = null; try { sessionStorage.removeItem('cred'); } catch (e) {} vistaLogin(); }
};

/* ---------- Login ---------- */
function vistaLogin() {
  nav(false);
  app.innerHTML = `<section class="card login"><div class="hero" aria-hidden="true">🎒</div><h1>Conocimiento del Medio</h1><p class="mut">Practica con exámenes de prueba.</p>
  <label>Usuario<input type="text" id="u" autocapitalize="none" autocomplete="username"></label>
  <label>Contraseña<input type="password" id="p" autocomplete="current-password"></label>
  <p class="err" id="err" role="alert"></p><button class="btn" id="go">Entrar</button></section>`;
  const entrar = async () => {
    const b = $('#go'); b.disabled = true; $('#err').textContent = '';
    const ok = await entrarCon({ p_nombre: $('#u').value.trim(), p_clave: $('#p').value });
    b.disabled = false;
    if (!ok) { $('#err').textContent = 'Usuario o contraseña incorrectos. Revísalos e inténtalo otra vez.'; return; }
    inicio();
  };
  $('#go').onclick = entrar;
  $('#p').onkeydown = e => { if (e.key === 'Enter') entrar(); };
}

/* ---------- Lista de exámenes ---------- */
async function vistaLista() {
  nav(true);
  app.innerHTML = `<div class="seg">${['quinto','sexto'].map(n => `<button data-n="${n}" class="${n === nivel ? 'on' : ''}">${nivelTxt(n)} de Primaria</button>`).join('')}</div>
  <h2>Elige un examen</h2><div id="lista" class="mut">Cargando…</div>`;
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { nivel = b.dataset.n; try { localStorage.setItem('nivel', nivel); } catch (e) {} vistaLista(); });
  try {
    const idx = await getJSON(`${RUTA}/${nivel}/index.json`);
    const data = esProfe() ? [] : await intentos();
    const ult = {}; (data || []).forEach(a => { ult[a.exam_id] ??= a; });
    if (!idx.length) throw 0;
    $('#lista').className = '';
    if (esProfe()) {
      $('#lista').innerHTML = idx.map((x, i) => `<div class="exam t${i % 4}"><span class="ico">${IC[i % 4]}</span><span class="ttl"><b>${esc(x.titulo)}</b></span><span class="acts"><button class="sm" data-ver="${esc(x.id)}">Ver con respuestas</button><button class="sm pri" data-probar="${esc(x.id)}">Probar</button></span></div>`).join('')
        + '<p class="mut">Al probar un examen no se guarda ningún resultado.</p>';
      $('#lista').querySelectorAll('[data-ver]').forEach(b => b.onclick = () => vistaSolucion(b.dataset.ver));
      $('#lista').querySelectorAll('[data-probar]').forEach(b => b.onclick = () => vistaExamen(b.dataset.probar));
      return;
    }
    $('#lista').innerHTML = idx.map((x, i) => { const a = ult[`${nivel}/${x.id}`];
      return `<button class="exam t${i % 4}" data-id="${esc(x.id)}"><span class="ico">${IC[i % 4]}</span><span class="ttl"><b>${esc(x.titulo)}</b><small>${a ? 'Última vez: ' + fecha(a.created_at) : 'Todavía sin hacer'}</small></span><span class="badge ${a ? cls(nota(a)) : 'go'}" ${a ? '' : 'aria-label="Empezar"'}>${a ? fmt(nota(a)) : '▶'}</span></button>`; }).join('');
    $('#lista').querySelectorAll('button').forEach(b => b.onclick = () => vistaExamen(b.dataset.id));
  } catch (e) { $('#lista').textContent = 'Todavía no hay exámenes para este curso.'; }
}

/* ---------- Examen ---------- */
async function vistaExamen(id) {
  app.innerHTML = '<p class="mut">Cargando examen…</p>';
  let ex; try { ex = await getJSON(`${RUTA}/${nivel}/${id}.json`); } catch (e) { app.innerHTML = '<p class="err">No se ha podido abrir el examen. Vuelve a la lista e inténtalo de nuevo.</p>'; return; }
  const test = (ex.test || []).map(q => ({ ...q, o: shuffle(q.opciones.map((t, i) => ({ t, ok: i === q.correcta }))) }));
  const dev = ex.desarrollo || [], ev = [];
  let tc = 0, dT = [], dO = [];
  app.onclick = null;
  app.innerHTML = `<h2>${esc(ex.titulo)}</h2>
  <div class="prog"><span id="pt">0 de ${test.length + dev.length} contestadas</span><div class="bar"><i id="pb"></i></div></div>
  ${test.length ? '<h3>Test</h3>' : ''}
  ${test.map((q, i) => `<div class="card q"><h3><span class="num">${i + 1}</span><span>${esc(q.pregunta)}</span></h3>${q.o.map((o, j) => `<label class="opt"><input type="radio" name="t${i}" value="${j}"><span class="let">${'ABCDEF'[j]}</span><span>${esc(o.t)}</span></label>`).join('')}</div>`).join('')}
  ${dev.length ? '<h3>Preguntas a desarrollar</h3>' : ''}
  ${dev.map((q, i) => `<div class="card q"><h3><span class="num">${test.length + i + 1}</span><span>${esc(q.pregunta)}</span></h3>
    <textarea id="r${i}" rows="5" placeholder="Escribe aquí tu respuesta…"></textarea></div>`).join('')}
  <button class="btn" id="fin">Terminar examen</button>`;
  const upd = () => {
    if (!$('#pt')) return;
    const n = test.filter((_, i) => document.querySelector(`input[name=t${i}]:checked`)).length + dev.filter((_, i) => $('#r' + i).value.trim()).length, t = test.length + dev.length;
    $('#pt').textContent = `${n} de ${t} contestadas`; $('#pb').style.width = (t ? n / t * 100 : 0) + '%';
  };
  app.oninput = upd;

  $('#fin').onclick = () => {
    const sin = test.filter((_, i) => !document.querySelector(`input[name=t${i}]:checked`)).length;
    if (sin && !confirm(`Te faltan ${sin} pregunta(s) del test, que contarán 0. ¿Terminar igualmente?`)) return;
    tc = 0;
    dT = test.map((q, i) => { const r = document.querySelector(`input[name=t${i}]:checked`), s = r ? Number(r.value) : null, ok = s !== null && q.o[s].ok; if (ok) tc++;
      return { pregunta: q.pregunta, elegida: s !== null ? q.o[s].t : null, correcta: q.o.find(o => o.ok).t, ok, explicacion: q.explicacion || '' }; });
    dO = dev.map((q, i) => ({ pregunta: q.pregunta, respuesta: $('#r' + i).value, modelo: q.respuesta_modelo, puntos: 0 }));
    dev.length ? autocorreccion() : guardar();
  };

  function autocorreccion() {
    app.innerHTML = `<h2>Autocorrección</h2><p class="mut">Lee la respuesta modelo, compárala con la tuya y marca cómo lo has hecho. Cuando termines, pulsa «Ver nota».</p>
    ${dO.map((q, i) => `<div class="card q"><h3><span class="num">${test.length + i + 1}</span><span>${esc(q.pregunta)}</span></h3>
      <p style="margin-bottom:4px"><b>Tu respuesta</b></p><p style="white-space:pre-wrap;margin-top:0">${esc(q.respuesta) || '<span class="mut">(vacía)</span>'}</p>
      <div class="modelo"><b>Respuesta modelo</b><p>${esc(q.modelo)}</p></div>
      <p><b>¿Cómo lo has hecho?</b></p>
      <div class="ev">${[['1', '✅ Lo tenía'], ['0.5', '🟡 En parte'], ['0', '❌ No']].map(([v, t]) => `<button data-i="${i}" data-e="${v}">${t}</button>`).join('')}</div></div>`).join('')}
    <button class="btn" id="nota">Ver nota</button>`;
    window.scrollTo(0, 0);
    app.onclick = e => {
      const t = e.target;
      if (t.dataset.e !== undefined) { ev[t.dataset.i] = Number(t.dataset.e); t.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b === t)); }
    };
    $('#nota').onclick = () => {
      const sinEv = dev.filter((_, i) => ev[i] === undefined).length;
      if (sinEv && !confirm(`Te faltan ${sinEv} autocorrección(es), que contarán 0. ¿Ver la nota igualmente?`)) return;
      dO.forEach((x, i) => { x.puntos = ev[i] ?? 0; });
      guardar();
    };
  }

  async function guardar() {
    ($('#nota') || $('#fin')).disabled = true;
    const fila = { username: user.nombre, exam_id: `${nivel}/${id}`, exam_title: ex.titulo, test_correct: tc, test_total: test.length,
      open_score: dO.reduce((s, x) => s + x.puntos, 0), open_total: dev.length, detail: { test: dT, open: dO } };
    if (esProfe()) { fila.created_at = new Date().toISOString(); vistaRevision(fila, 'Modo profesor: este intento no se ha guardado.'); return; }
    const { error } = await sb.rpc('examenes_guardar', { ...cred, p_exam_id: fila.exam_id, p_exam_title: fila.exam_title, p_test_correct: fila.test_correct, p_test_total: fila.test_total, p_open_score: fila.open_score, p_open_total: fila.open_total, p_detail: fila.detail });
    fila.created_at = new Date().toISOString();
    vistaRevision(fila, error ? 'No se ha podido guardar el resultado. Avisa a tu profesora o profesor.' : '');
  }
}

/* ---------- Revisión de un intento ---------- */
function vistaRevision(a, aviso) {
  const n = nota(a), c = cls(n), d = a.detail || { test: [], open: [] };
  const msg = n >= 9 ? '¡Sobresaliente! 🏆' : n >= 7 ? '¡Muy bien! 🎉' : n >= 5 ? 'Aprobado. Con un repaso más lo mejoras.' : 'Todavía no. Repasa el tema y vuelve a intentarlo.';
  app.onclick = null;
  app.innerHTML = `${aviso ? `<p class="${aviso.startsWith('Modo') ? 'mut' : 'err'}" role="alert">${esc(aviso)}</p>` : ''}
  <div class="card score ${c}"><div class="ring ${c}" style="--p:${Math.round(n * 10)}"><b>${fmt(n)}</b><span>de 10</span></div>
  <div><h2>${esc(a.exam_title)}</h2><p class="msg">${msg}</p>
  <div class="chips">${a.alumno ? `<span class="chip">${esc(a.alumno)}</span>` : ''}<span class="chip">${fecha(a.created_at)}</span><span class="chip">Test <b>${a.test_correct}</b> de ${a.test_total}</span><span class="chip">Desarrollo <b>${fmt(Number(a.open_score))}</b> de ${a.open_total}</span></div></div></div>
  ${d.test.length ? '<h3>Test</h3>' : ''}
  ${d.test.map((q, i) => `<div class="card q res ${q.ok ? 'good' : 'wrong'}"><h3><span class="num">${i + 1}</span><span>${esc(q.pregunta)}</span></h3>
    <p>Tu respuesta: <b class="${q.ok ? 'ok' : 'bad'}">${q.ok ? '✅' : '❌'} ${esc(q.elegida ?? 'Sin responder')}</b></p>
    ${q.ok ? '' : `<p>Respuesta correcta: <b class="ok">${esc(q.correcta)}</b></p>`}
    ${q.explicacion ? `<p class="mut">${esc(q.explicacion)}</p>` : ''}</div>`).join('')}
  ${d.open.length ? '<h3>Preguntas a desarrollar</h3>' : ''}
  ${d.open.map((q, i) => `<div class="card q res ${q.puntos === 1 ? 'good' : q.puntos === 0.5 ? 'part' : 'wrong'}"><h3><span class="num">${d.test.length + i + 1}</span><span>${esc(q.pregunta)}</span></h3>
    <p style="margin-bottom:4px"><b>Tu respuesta</b></p><p style="white-space:pre-wrap;margin-top:0">${esc(q.respuesta) || '<span class="mut">(vacía)</span>'}</p>
    <div class="modelo"><b>Respuesta modelo</b><p>${esc(q.modelo)}</p></div>
    <p class="mut">Tu autocorrección: ${q.puntos === 1 ? '✅ Lo tenía' : q.puntos === 0.5 ? '🟡 En parte' : '❌ No'}</p></div>`).join('')}
  <button class="btn" onclick="${a.alumno ? 'vistaProfe' : 'vistaLista'}()">${a.alumno ? 'Volver al panel' : 'Volver a los exámenes'}</button>`;
  window.scrollTo(0, 0);
}

/* ---------- Vista del profesor: examen con respuestas ---------- */
async function vistaSolucion(id) {
  app.onclick = null; app.innerHTML = '<p class="mut">Cargando examen…</p>';
  let ex; try { ex = await getJSON(`${RUTA}/${nivel}/${id}.json`); } catch (e) { app.innerHTML = '<p class="err">No se ha podido abrir el examen.</p>'; return; }
  const t = ex.test || [], d = ex.desarrollo || [];
  app.innerHTML = `<h2>${esc(ex.titulo)}</h2><p class="mut">Vista del profesor: las respuestas correctas aparecen marcadas.</p>
  ${t.length ? `<h3>Test, ${t.length} preguntas</h3>` : ''}
  ${t.map((q, i) => `<div class="card q"><h3><span class="num">${i + 1}</span><span>${esc(q.pregunta)}</span></h3>${q.opciones.map((o, j) => `<p class="sol ${j === q.correcta ? 'right' : ''}">${j === q.correcta ? '✅ ' : ''}${esc(o)}</p>`).join('')}${q.explicacion ? `<p class="mut">${esc(q.explicacion)}</p>` : ''}</div>`).join('')}
  ${d.length ? `<h3>Desarrollo, ${d.length} preguntas</h3>` : ''}
  ${d.map((q, i) => `<div class="card q"><h3><span class="num">${t.length + i + 1}</span><span>${esc(q.pregunta)}</span></h3><div class="modelo"><b>Respuesta modelo</b><p>${esc(q.respuesta_modelo)}</p></div></div>`).join('')}
  <button class="btn" onclick="vistaLista()">Volver a los exámenes</button>`;
  window.scrollTo(0, 0);
}

/* ---------- Panel del profesor ---------- */
async function vistaProfe() {
  nav(true); app.onclick = null;
  app.innerHTML = '<h2>Mis alumnos</h2><p class="mut">Cargando…</p>';
  const { data, error } = await sb.rpc('examenes_profe_resumen', cred);
  if (error || !data) { app.innerHTML = '<h2>Mis alumnos</h2><p class="err">No se han podido cargar los datos.</p>'; return; }
  const por = {}; data.alumnos.forEach(a => { por[a.id] = { nombre: a.nombre, l: [] }; });
  data.intentos.forEach(i => { if (por[i.alumno_id]) por[i.alumno_id].l.push(i); });
  const todos = [], filas = Object.values(por);
  const media = l => l.length ? l.reduce((s, a) => s + nota(a), 0) / l.length : null;
  const mGlobal = media(data.intentos);
  app.innerHTML = `<h2>Mis alumnos</h2>
  <div class="chips" style="margin-bottom:18px"><span class="chip"><b>${filas.length}</b> alumnos</span><span class="chip"><b>${filas.filter(f => f.l.length).length}</b> han hecho algún examen</span><span class="chip"><b>${data.intentos.length}</b> exámenes hechos</span><span class="chip">Nota media <b>${mGlobal === null ? '–' : fmt(mGlobal)}</b></span></div>
  ${filas.length ? '' : `<p>No hay alumnos cuyo nombre empiece por <b>${esc(data.prefijo)}</b>.</p>`}
  ${filas.map(f => { const m = media(f.l); return `<details class="card"><summary><span class="who"><i class="av" style="--h:${hue(f.nombre)}">${esc((f.nombre.split('-').pop().charAt(0) || '?').toUpperCase())}</i><span>${esc(f.nombre)}<br><span class="meta">${f.l.length ? `${f.l.length} examen${f.l.length > 1 ? 'es' : ''}, media <b class="${cls(m)}">${fmt(m)}</b>` : 'Sin exámenes'}</span></span></span></summary>
    ${f.l.map(a => { todos.push(a); return tileIntento(a, `data-t="${todos.length - 1}"`, todos.length - 1); }).join('')}
    </details>`; }).join('')}`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => vistaRevision(todos[b.dataset.t]));
}

/* ---------- Mis resultados ---------- */
async function vistaResultados() {
  app.onclick = null;
  app.innerHTML = '<h2>Mis resultados</h2><p class="mut">Cargando…</p>';
  let data; try { data = await intentos(); } catch (e) { app.innerHTML = '<h2>Mis resultados</h2><p class="err">No se han podido cargar tus resultados.</p>'; return; }
  if (!data.length) { app.innerHTML = '<h2>Mis resultados</h2><p>Aún no has hecho ningún examen. ¡Empieza con el primero!</p><button class="btn" onclick="vistaLista()">Ir a los exámenes</button>'; return; }
  const media = data.reduce((s, a) => s + nota(a), 0) / data.length;
  const por = {}; data.forEach(a => { (por[a.exam_id] ||= { t: a.exam_title, l: [] }).l.push(a); });
  app.innerHTML = `<h2>Mis resultados</h2>
  <div class="chips" style="margin-bottom:6px"><span class="chip"><b>${data.length}</b> exámenes hechos</span><span class="chip">Nota media <b>${fmt(media)}</b></span></div>
  <h3>Cómo vas en cada examen</h3>
  ${Object.values(por).map(g => { const mejor = Math.max(...g.l.map(nota)); return `<div class="card"><div class="row"><h3 style="margin:0">${esc(g.t)}</h3><span class="chip">Mejor nota <b>${fmt(mejor)}</b></span></div>
    <div class="spark">${g.l.slice().reverse().map(a => `<span class="col" title="${fecha(a.created_at)}"><small>${fmt(nota(a))}</small><i class="${cls(nota(a))}" style="height:${Math.max(nota(a) * 8.8, 4)}px"></i></span>`).join('')}</div>
    <p class="mut" style="margin:10px 0 0">Cada columna es un intento, del más antiguo al más reciente.</p></div>`; }).join('')}
  <h3>Historial</h3>
  ${data.map((a, i) => tileIntento(a, `data-i="${i}"`, i)).join('')}`;
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => vistaRevision(data[b.dataset.i]));
}

/* ---------- Inicio ---------- */
if (SUPABASE_URL.startsWith('PEGA')) { app.innerHTML = '<p class="err">Falta configurar SUPABASE_URL y SUPABASE_KEY al principio del archivo.</p>'; }
else (async () => { try { const c = JSON.parse(sessionStorage.getItem('cred')); if (c && await entrarCon(c)) return inicio(); } catch (e) {} vistaLogin(); })();
</script>
