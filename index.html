<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conocimiento del Medio · Exámenes de práctica</title>
<style>
:root{--bg:#f6f8fc;--grid:#dfe7f3;--card:#fff;--ink:#1c2b45;--mut:#586783;--acc:#2455c3;--on:#fff;--hl:#ffe36e;--ok:#17803f;--mid:#a86f00;--bad:#c0392b;--line:#d5deec}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--grid:#18233a;--card:#172036;--ink:#eaf0fb;--mut:#a3b1cb;--acc:#7fa6ff;--on:#0b1428;--hl:#6b5a00;--ok:#4cd081;--mid:#ffc24d;--bad:#ff8577;--line:#2a3a5a}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.5 ui-rounded,"Trebuchet MS",system-ui,sans-serif;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:2px solid var(--line)}
header b{font-size:1.05rem}
nav{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h2{font-size:1.4rem}h3{font-size:1.05rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700;padding:11px 20px}
.btn:disabled{opacity:.6}
.seg{display:flex;gap:8px;margin-bottom:18px}
.seg button{flex:1;font-weight:700;padding:12px}
.seg .on{background:var(--hl);border-color:var(--ink);color:var(--ink)}
@media(prefers-color-scheme:dark){.seg .on{color:#fff}}
label{display:block;font-weight:700;margin-bottom:12px}
input[type=text],input[type=password],textarea{display:block;width:100%;font:inherit;margin-top:4px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.login{max-width:380px;margin:40px auto}
.err{color:var(--bad);min-height:1.5em;margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;font-weight:400;padding:9px 11px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--acc);background:var(--bg)}
.opt input{margin-top:6px}
.modelo{margin-top:12px;padding:12px;border-left:5px solid var(--acc);background:var(--bg);border-radius:6px}
.ev{display:flex;gap:8px;flex-wrap:wrap}
.ev button.sel{border-color:var(--ink);background:var(--hl);color:var(--ink)}
@media(prefers-color-scheme:dark){.ev button.sel{color:#fff}}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nota{font-size:2.4rem;font-weight:800}
.mut{color:var(--mut);font-size:.92rem}
.ok{color:var(--ok)}.mid{color:var(--mid)}.bad{color:var(--bad)}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stats .card{margin:0;text-align:center}
.stats b{display:block;font-size:1.8rem}
.item{width:100%;text-align:left;display:block;margin-bottom:10px;padding:12px 14px}
details.card summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}
details.card[open] summary{margin-bottom:12px}
</style>
</head>
<body>
<header><b>🌍 Conocimiento del Medio</b><nav id="nav" hidden>
<button data-go="profe" hidden>Mis alumnos</button><button data-go="lista">Exámenes</button><button data-go="res">Mis resultados</button><button data-go="out">Salir</button></nav></header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIGURACIÓN ===== */
const SUPABASE_URL = 'https://rsnlvstocpajmxcihbhs.supabase.co';       // https://xxxx.supabase.co
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzbmx2c3RvY3Bham14Y2loYmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMTAzNzEsImV4cCI6MjA4NDc4NjM3MX0.AAkZ3nAxzThYPIVCLWmt_qc8sUsKgS7u_98HrtT3y_0';  // clave pública "anon"
const RUTA = 'examenes';                        // carpeta: examenes/quinto/ y examenes/sexto/
/* ========================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
let cred = null;  // { p_nombre, p_clave }: se envía a cada función de Supabase
const intentos = async () => { const { data, error } = await sb.rpc('examenes_mis_intentos', cred); if (error) throw error; return data || []; };
async function entrarCon(c) {
  const { data } = await sb.rpc('examenes_login', c);
  if (!data) return false;
  user = data; cred = c; try { sessionStorage.setItem('cred', JSON.stringify(c)); } catch (e) {}
  return true;
}
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, '');
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
const nota = a => { const t = a.test_total + a.open_total; return t ? (a.test_correct + Number(a.open_score)) / t * 10 : 0; };
const nivelTxt = n => n === 'quinto' ? '5.º' : '6.º';
const fecha = d => new Date(d).toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'});
let user = null, nivel = 'quinto';
try { nivel = localStorage.getItem('nivel') || 'quinto'; } catch (e) {}

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url); return r.json(); }
const esProfe = () => !!user && /^profe-/i.test(user.nombre);
function inicio() { esProfe() ? vistaProfe() : vistaLista(); }
function nav(on) {
  $('#nav').hidden = !on;
  if (on && user) document.querySelectorAll('#nav [data-go]').forEach(b => { b.hidden = b.dataset.go === 'out' ? false : (b.dataset.go === 'profe') !== esProfe(); });
}

$('#nav').onclick = e => {
  const g = e.target.dataset.go; if (!g) return;
  if (g === 'profe') vistaProfe();
  if (g === 'lista') vistaLista();
  if (g === 'res') vistaResultados();
  if (g === 'out') { user = null; cred = null; try { sessionStorage.removeItem('cred'); } catch (e) {} vistaLogin(); }
};

/* ---------- Login ---------- */
function vistaLogin() {
  nav(false);
  app.innerHTML = `<section class="card login"><h1>¡Hola! 👋</h1><p class="mut">Entra para practicar con exámenes de prueba.</p>
  <label>Usuario<input type="text" id="u" autocapitalize="none" autocomplete="username"></label>
  <label>Contraseña<input type="password" id="p" autocomplete="current-password"></label>
  <p class="err" id="err" role="alert"></p><button class="btn" id="go">Entrar</button></section>`;
  const entrar = async () => {
    const b = $('#go'); b.disabled = true; $('#err').textContent = '';
    const ok = await entrarCon({ p_nombre: $('#u').value.trim(), p_clave: $('#p').value });
    b.disabled = false;
    if (!ok) { $('#err').textContent = 'Usuario o contraseña incorrectos. Revísalos e inténtalo otra vez.'; return; }
    inicio();
  };
  $('#go').onclick = entrar;
  $('#p').onkeydown = e => { if (e.key === 'Enter') entrar(); };
}

/* ---------- Lista de exámenes ---------- */
async function vistaLista() {
  nav(true);
  app.innerHTML = `<div class="seg">${['quinto','sexto'].map(n => `<button data-n="${n}" class="${n === nivel ? 'on' : ''}">${nivelTxt(n)} de Primaria</button>`).join('')}</div>
  <h2>Elige un examen</h2><div id="lista" class="mut">Cargando…</div>`;
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { nivel = b.dataset.n; try { localStorage.setItem('nivel', nivel); } catch (e) {} vistaLista(); });
  try {
    const idx = await getJSON(`${RUTA}/${nivel}/index.json`);
    const data = await intentos();
    const ult = {}; (data || []).forEach(a => { ult[a.exam_id] ??= a; });
    if (!idx.length) throw 0;
    $('#lista').className = '';
    $('#lista').innerHTML = idx.map(x => { const a = ult[`${nivel}/${x.id}`];
      return `<button class="card item" data-id="${esc(x.id)}"><div class="row"><b>${esc(x.titulo)}</b>
      <span class="mut">${a ? `Última nota: <b>${fmt(nota(a))}</b>` : 'Sin hacer'}</span></div></button>`; }).join('');
    $('#lista').querySelectorAll('button').forEach(b => b.onclick = () => vistaExamen(b.dataset.id));
  } catch (e) { $('#lista').textContent = 'Todavía no hay exámenes para este curso.'; }
}

/* ---------- Examen ---------- */
async function vistaExamen(id) {
  app.innerHTML = '<p class="mut">Cargando examen…</p>';
  let ex; try { ex = await getJSON(`${RUTA}/${nivel}/${id}.json`); } catch (e) { app.innerHTML = '<p class="err">No se ha podido abrir el examen. Vuelve a la lista e inténtalo de nuevo.</p>'; return; }
  const test = (ex.test || []).map(q => ({ ...q, o: shuffle(q.opciones.map((t, i) => ({ t, ok: i === q.correcta }))) }));
  const dev = ex.desarrollo || [], ev = [];
  let tc = 0, dT = [], dO = [];
  app.onclick = null;
  app.innerHTML = `<h2>${esc(ex.titulo)}</h2>
  ${test.length ? '<h3 class="mut">Parte 1 · Test</h3>' : ''}
  ${test.map((q, i) => `<div class="card"><h3>${i + 1}. ${esc(q.pregunta)}</h3>${q.o.map((o, j) => `<label class="opt"><input type="radio" name="t${i}" value="${j}"><span>${esc(o.t)}</span></label>`).join('')}</div>`).join('')}
  ${dev.length ? '<h3 class="mut">Parte 2 · Preguntas a desarrollar</h3>' : ''}
  ${dev.map((q, i) => `<div class="card"><h3>${test.length + i + 1}. ${esc(q.pregunta)}</h3>
    <textarea id="r${i}" rows="5" placeholder="Escribe aquí tu respuesta…"></textarea></div>`).join('')}
  <button class="btn" id="fin">Terminar examen</button>`;

  $('#fin').onclick = () => {
    const sin = test.filter((_, i) => !document.querySelector(`input[name=t${i}]:checked`)).length;
    if (sin && !confirm(`Te faltan ${sin} pregunta(s) del test, que contarán 0. ¿Terminar igualmente?`)) return;
    tc = 0;
    dT = test.map((q, i) => { const r = document.querySelector(`input[name=t${i}]:checked`), s = r ? Number(r.value) : null, ok = s !== null && q.o[s].ok; if (ok) tc++;
      return { pregunta: q.pregunta, elegida: s !== null ? q.o[s].t : null, correcta: q.o.find(o => o.ok).t, ok, explicacion: q.explicacion || '' }; });
    dO = dev.map((q, i) => ({ pregunta: q.pregunta, respuesta: $('#r' + i).value, modelo: q.respuesta_modelo, puntos: 0 }));
    dev.length ? autocorreccion() : guardar();
  };

  function autocorreccion() {
    app.innerHTML = `<h2>Autocorrección</h2><p>Lee la respuesta modelo, compárala con la tuya y marca cómo lo has hecho. Cuando termines, pulsa «Ver nota».</p>
    ${dO.map((q, i) => `<div class="card"><h3>${test.length + i + 1}. ${esc(q.pregunta)}</h3>
      <p style="margin-bottom:4px"><b>Tu respuesta</b></p><p style="white-space:pre-wrap;margin-top:0">${esc(q.respuesta) || '<span class="mut">(vacía)</span>'}</p>
      <div class="modelo"><b>Respuesta modelo</b><p>${esc(q.modelo)}</p><p><b>¿Cómo lo has hecho?</b></p>
      <div class="ev">${[['1', '✅ Lo tenía'], ['0.5', '🟡 En parte'], ['0', '❌ No']].map(([v, t]) => `<button data-i="${i}" data-e="${v}">${t}</button>`).join('')}</div></div></div>`).join('')}
    <button class="btn" id="nota">Ver nota</button>`;
    window.scrollTo(0, 0);
    app.onclick = e => {
      const t = e.target;
      if (t.dataset.e !== undefined) { ev[t.dataset.i] = Number(t.dataset.e); t.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b === t)); }
    };
    $('#nota').onclick = () => {
      const sinEv = dev.filter((_, i) => ev[i] === undefined).length;
      if (sinEv && !confirm(`Te faltan ${sinEv} autocorrección(es), que contarán 0. ¿Ver la nota igualmente?`)) return;
      dO.forEach((x, i) => { x.puntos = ev[i] ?? 0; });
      guardar();
    };
  }

  async function guardar() {
    ($('#nota') || $('#fin')).disabled = true;
    const fila = { username: user.nombre, exam_id: `${nivel}/${id}`, exam_title: ex.titulo, test_correct: tc, test_total: test.length,
      open_score: dO.reduce((s, x) => s + x.puntos, 0), open_total: dev.length, detail: { test: dT, open: dO } };
    const { error } = await sb.rpc('examenes_guardar', { ...cred, p_exam_id: fila.exam_id, p_exam_title: fila.exam_title, p_test_correct: fila.test_correct, p_test_total: fila.test_total, p_open_score: fila.open_score, p_open_total: fila.open_total, p_detail: fila.detail });
    fila.created_at = new Date().toISOString();
    vistaRevision(fila, error ? 'No se ha podido guardar el resultado. Avisa a tu profesora o profesor.' : '');
  }
}

/* ---------- Revisión de un intento ---------- */
function vistaRevision(a, aviso) {
  const n = nota(a), d = a.detail || { test: [], open: [] };
  app.onclick = null;
  app.innerHTML = `${aviso ? `<p class="err" role="alert">${esc(aviso)}</p>` : ''}
  <div class="card row"><div><h2>${esc(a.exam_title)}</h2><span class="mut">${a.alumno ? esc(a.alumno) + ' · ' : ''}${fecha(a.created_at)} · Test: ${a.test_correct}/${a.test_total} · Desarrollo: ${fmt(Number(a.open_score))}/${a.open_total}</span></div>
  <div class="nota ${n >= 5 ? 'ok' : 'bad'}">${fmt(n)}<span class="mut" style="font-size:1rem"> / 10</span></div></div>
  ${d.test.length ? '<h3 class="mut">Test</h3>' : ''}
  ${d.test.map((q, i) => `<div class="card"><h3>${q.ok ? '✅' : '❌'} ${i + 1}. ${esc(q.pregunta)}</h3>
    <p>Tu respuesta: <b class="${q.ok ? 'ok' : 'bad'}">${esc(q.elegida ?? 'Sin responder')}</b></p>
    ${q.ok ? '' : `<p>Respuesta correcta: <b class="ok">${esc(q.correcta)}</b></p>`}
    ${q.explicacion ? `<p class="mut">${esc(q.explicacion)}</p>` : ''}</div>`).join('')}
  ${d.open.length ? '<h3 class="mut">Preguntas a desarrollar</h3>' : ''}
  ${d.open.map((q, i) => `<div class="card"><h3>${q.puntos === 1 ? '✅' : q.puntos === 0.5 ? '🟡' : '❌'} ${esc(q.pregunta)}</h3>
    <p><b>Tu respuesta:</b> ${esc(q.respuesta) || '<span class="mut">(vacía)</span>'}</p><div class="modelo"><b>Respuesta modelo</b><p>${esc(q.modelo)}</p></div></div>`).join('')}
  <button class="btn" onclick="inicio()">${esProfe() ? 'Volver al panel' : 'Volver a los exámenes'}</button>`;
  window.scrollTo(0, 0);
}

/* ---------- Panel del profesor ---------- */
async function vistaProfe() {
  nav(true); app.onclick = null;
  app.innerHTML = '<h2>Mis alumnos</h2><p class="mut">Cargando…</p>';
  const { data, error } = await sb.rpc('examenes_profe_resumen', cred);
  if (error || !data) { app.innerHTML = '<h2>Mis alumnos</h2><p class="err">No se han podido cargar los datos.</p>'; return; }
  const por = {}; data.alumnos.forEach(a => { por[a.id] = { nombre: a.nombre, l: [] }; });
  data.intentos.forEach(i => { if (por[i.alumno_id]) por[i.alumno_id].l.push(i); });
  const todos = [], filas = Object.values(por);
  const media = l => l.length ? l.reduce((s, a) => s + nota(a), 0) / l.length : null;
  const mGlobal = media(data.intentos);
  app.innerHTML = `<h2>Mis alumnos</h2>
  <div class="stats"><div class="card"><b>${filas.length}</b><span class="mut">alumnos</span></div>
  <div class="card"><b>${filas.filter(f => f.l.length).length}</b><span class="mut">han hecho algún examen</span></div>
  <div class="card"><b>${data.intentos.length}</b><span class="mut">exámenes hechos</span></div>
  <div class="card"><b>${mGlobal === null ? '–' : fmt(mGlobal)}</b><span class="mut">nota media</span></div></div>
  ${filas.length ? '' : `<p>No hay alumnos cuyo nombre empiece por <b>${esc(data.prefijo)}</b>.</p>`}
  ${filas.map(f => { const m = media(f.l); return `<details class="card"><summary><span>${esc(f.nombre)}</span>
    <span class="mut">${f.l.length ? `${f.l.length} examen(es) · media <b>${fmt(m)}</b>` : 'Sin exámenes'}</span></summary>
    ${f.l.map(a => { todos.push(a); return `<button class="card item" data-t="${todos.length - 1}"><div class="row"><span><b>${esc(a.exam_title)}</b><br><span class="mut">${nivelTxt(a.exam_id.split('/')[0])} · ${fecha(a.created_at)}</span></span><b class="${nota(a) >= 5 ? 'ok' : 'bad'}">${fmt(nota(a))}</b></div></button>`; }).join('')}
    </details>`; }).join('')}`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => vistaRevision(todos[b.dataset.t]));
}

/* ---------- Mis resultados ---------- */
async function vistaResultados() {
  app.onclick = null;
  app.innerHTML = '<h2>Mis resultados</h2><p class="mut">Cargando…</p>';
  let data; try { data = await intentos(); } catch (e) { app.innerHTML = '<h2>Mis resultados</h2><p class="err">No se han podido cargar tus resultados.</p>'; return; }
  if (!data.length) { app.innerHTML = '<h2>Mis resultados</h2><p>Aún no has hecho ningún examen. ¡Empieza con el primero!</p><button class="btn" onclick="vistaLista()">Ir a los exámenes</button>'; return; }
  const media = data.reduce((s, a) => s + nota(a), 0) / data.length;
  const por = {}; data.forEach(a => { (por[a.exam_id] ||= { t: a.exam_title, l: [] }).l.push(a); });
  app.innerHTML = `<h2>Mis resultados</h2>
  <div class="stats"><div class="card"><b>${data.length}</b><span class="mut">exámenes hechos</span></div><div class="card"><b>${fmt(media)}</b><span class="mut">nota media</span></div></div>
  <h3 class="mut">Por examen</h3>
  ${Object.values(por).map(g => { const mejor = Math.max(...g.l.map(nota)); return `<div class="card"><div class="row"><b>${esc(g.t)}</b><span class="mut">${g.l.length} intento(s) · mejor nota ${fmt(mejor)}</span></div>
    ${g.l.slice().reverse().map(a => `<div class="bar" title="${fecha(a.created_at)}: ${fmt(nota(a))}"><i style="width:${nota(a) * 10}%"></i></div>`).join('')}
    <p class="mut" style="margin:6px 0 0">Cada barra es un intento, del más antiguo al más reciente.</p></div>`; }).join('')}
  <h3 class="mut">Historial</h3>
  ${data.map((a, i) => `<button class="card item" data-i="${i}"><div class="row"><span><b>${esc(a.exam_title)}</b><br><span class="mut">${nivelTxt(a.exam_id.split('/')[0])} · ${fecha(a.created_at)}</span></span><b class="${nota(a) >= 5 ? 'ok' : 'bad'}">${fmt(nota(a))}</b></div></button>`).join('')}`;
  app.querySelectorAll('.item[data-i]').forEach(b => b.onclick = () => vistaRevision(data[b.dataset.i]));
}

/* ---------- Inicio ---------- */
if (SUPABASE_URL.startsWith('PEGA')) { app.innerHTML = '<p class="err">Falta configurar SUPABASE_URL y SUPABASE_KEY al principio del archivo.</p>'; }
else (async () => { try { const c = JSON.parse(sessionStorage.getItem('cred')); if (c && await entrarCon(c)) return inicio(); } catch (e) {} vistaLogin(); })();
</script>
</body>
</html>
